services:
  lander:
    build: .
    ports:
      - "${PORT:-8000}:8000"
    environment:
      - LANDER_DB_PATH=/app/data/lander.db
    volumes:
      - lander-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  lander-data:
